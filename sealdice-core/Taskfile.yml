# https://taskfile.dev

version: '3'

env:
  GOPATH: '{{.ROOT_DIR}}\.devtools\gopath'
  GOMODCACHE: '{{.ROOT_DIR}}\.devtools\gopath\pkg\mod'
  GOCACHE: '{{.ROOT_DIR}}\.devtools\gocache'
  GOBIN: '{{.ROOT_DIR}}\.devtools\gobin'
  GOLANGCI_LINT_CACHE: '{{.ROOT_DIR}}\.devtools\golangci-lint-cache'
  TMP: '{{.ROOT_DIR}}\.devtools\tmp'
  TEMP: '{{.ROOT_DIR}}\.devtools\tmp'
  GOPROXY: https://goproxy.cn,direct
  NO_PROXY: localhost,127.0.0.1

vars:
  GO: '{{.ROOT_DIR}}/.devtools/go1.25.0/bin/go.exe'
  GOIMPORTS: '{{.ROOT_DIR}}/.devtools/gobin/goimports.exe'
  GOLANGCI: '{{.ROOT_DIR}}/.devtools/gobin/golangci-lint.exe'

tasks:
  install:
    cmds:
      - '{{.GO}} mod download'
      - '{{.GO}} install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2'
      - '{{.GO}} install golang.org/x/tools/cmd/goimports@latest'
      - '{{.GO}} install github.com/pointlander/peg@v1.0.1'
      - '{{.GO}} generate ./...'

  run:
    deps: ['test-and-lint']
    cmds:
      - '{{.GO}} run .'
  build:
    deps: ['test-and-lint']
    cmds:
      - task: build-only
  
  test-and-lint:
    deps: ['test', 'lint']
  test:
    cmds:
      - '{{.GO}} test ./...'
      - '{{.GO}} vet ./...'
  lint:
    cmds:
      - '{{.GOIMPORTS}} -w .'
      - '{{.GOLANGCI}} run'

  build-only:
    cmds:
      - '{{.GO}} build .'
